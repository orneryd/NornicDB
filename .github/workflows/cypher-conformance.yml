name: Cypher Conformance

on:
  push:
    branches: [main]
    paths:
      - "pkg/**"
      - "testing/cypher/**"
      - "scripts/cypher-tck/**"
      - "docs/plans/cypher-convergence-*.md"
      - "openspec/**"
      - ".github/workflows/cypher-conformance.yml"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [main]
    paths:
      - "pkg/**"
      - "testing/cypher/**"
      - "scripts/cypher-tck/**"
      - "docs/plans/cypher-convergence-*.md"
      - "openspec/**"
      - ".github/workflows/cypher-conformance.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Cypher conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify pinned corpus and run conformance regressions
        run: |
          mkdir -p artifacts
          set -o pipefail
          make cypher-conformance 2>&1 | tee artifacts/conformance.log

      - name: Compare fixed corpus with pinned Neo4j
        run: |
          set -o pipefail
          make cypher-differential 2>&1 | tee artifacts/differential.log

      - name: Upload conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypher-conformance-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
