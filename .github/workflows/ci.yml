name: CI

# Release-to-main pull requests request release-verification.yml; other PRs
# do not run CI automatically. Manual GitHub runs require
# approval through the admin-approved-actions environment before jobs start.
# See CONTRIBUTING.md, "Development workflow".
on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to check out"
        required: true
        type: string
    secrets:
      COVERALLS_REPO_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch, tag, or commit SHA to run CI against (default: the branch selected above)"
        required: false
        default: ""
        type: string
      test_only:
        description: "Run the exact make test gate against the selected candidate"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A newer request for the same pull request or ref replaces a running one.
concurrency:
  group: ci-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build
    if: ${{ inputs.test_only != true }}
    # Manual and reusable runs wait for an administrator before allocating a runner.
    environment: ${{ github.event_name == 'push' && 'automatic-publishing' || 'admin-approved-actions' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.branch || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Validate localization catalogs
        run: |
          go test ./pkg/localization ./scripts/localization_catalog ./scripts/localization_inventory
          go generate ./pkg/localization
          git diff --exit-code -- pkg/localization/catalog_manifest_gen.go
          go run ./scripts/localization_catalog -check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build UI assets
        run: |
          cd ui
          npm ci
          npm run build

      - name: Prepare llama CPU libs
        run: bash scripts/hydrate-llama-cpu-libs.sh

      - name: Build
        run: make build

      - name: Build local GGUF provider with yzma
        run: CGO_ENABLED=0 go build -tags 'noui,localllm,yzma' -o /tmp/nornicdb-yzma ./cmd/nornicdb

  coverage:
    name: Test and Coverage
    if: ${{ inputs.test_only != true }}
    # Manual and reusable runs wait for an administrator before allocating a runner.
    environment: ${{ github.event_name == 'push' && 'automatic-publishing' || 'admin-approved-actions' }}
    runs-on: ubuntu-latest
    needs: test
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.branch || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build UI assets
        run: |
          cd ui
          npm ci
          npm run build

      - name: Prepare llama CPU libs
        run: bash scripts/hydrate-llama-cpu-libs.sh

      - name: Test and Generate coverage report
        # The groups live in scripts/ci/test-groups.sh so `make verify` runs
        # exactly the same suite locally. It stops at the first failing group
        # and writes coverage.out for goveralls.
        run: bash scripts/ci/test-groups.sh coverage.raw.out coverage.out

      - name: Install goveralls
        run: go install github.com/mattn/goveralls@latest

      - name: Upload coverage to Coveralls
        if: ${{ env.COVERALLS_REPO_TOKEN != '' }}
        run: |
          "$(go env GOPATH)/bin/goveralls" \
            -coverprofile=coverage.out \
            -service=github \
            -repotoken="$COVERALLS_REPO_TOKEN"

  make-test:
    name: make test
    if: ${{ inputs.test_only == true }}
    environment: admin-approved-actions
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record checked revision
        run: git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Build UI assets
        run: npm ci --prefix ui && npm run build --prefix ui
      - name: Prepare llama CPU libs
        run: bash scripts/hydrate-llama-cpu-libs.sh
      - name: Run make test
        run: |
          set -o pipefail
          # Preserve package/process RSS and cgroup OOM counters alongside the
          # unchanged gate, including when the test process is terminated.
          (
            while true; do
              date -u
              free -m
              ps -eo pid,ppid,rss,args --sort=-rss | sed -n '1,12p'
              for metric in memory.current memory.peak memory.max memory.events; do
                if [ -r "/sys/fs/cgroup/$metric" ]; then
                  printf '%s: ' "$metric"
                  cat "/sys/fs/cgroup/$metric"
                fi
              done
              sleep 15
            done
          ) > make-test-resources.log 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          make test 2>&1 | tee make-test.log
      - name: Upload test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: make-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            make-test.log
            make-test-raw.log
            make-test-resources.log
          if-no-files-found: warn
