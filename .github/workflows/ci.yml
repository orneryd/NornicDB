name: CI

# Release-to-main pull requests request release-verification.yml; other PRs
# do not run CI automatically. Manual GitHub runs require
# approval through the admin-approved-actions environment before jobs start.
# See CONTRIBUTING.md, "Development workflow".
on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to check out"
        required: true
        type: string
      test_only:
        description: "Run the complete make test suite only"
        required: false
        default: false
        type: boolean
    secrets:
      COVERALLS_REPO_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch, tag, or commit SHA to run CI against (default: the branch selected above)"
        required: false
        default: ""
        type: string
      test_only:
        description: "Run the complete make test suite only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A newer request for the same pull request or ref replaces a running one.
concurrency:
  group: ci-${{ inputs.ref || inputs.branch || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build
    needs: coverage-plan
    if: ${{ inputs.test_only != true }}
    # Manual and reusable runs wait for an administrator before allocating a runner.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.coverage-plan.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Validate localization catalogs
        run: |
          go test ./pkg/localization ./scripts/localization_catalog ./scripts/localization_inventory
          go generate ./pkg/localization
          git diff --exit-code -- pkg/localization/catalog_manifest_gen.go
          go run ./scripts/localization_catalog -check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build UI assets
        run: |
          cd ui
          npm ci
          npm run build

      - name: Prepare llama CPU libs
        run: bash scripts/hydrate-llama-cpu-libs.sh

      - name: Build
        run: make build

  coverage-plan:
    environment: ${{ github.event_name == 'push' && 'automatic-publishing' || 'admin-approved-actions' }}
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      sha: ${{ steps.groups.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.branch || github.ref }}
          persist-credentials: false
      - id: groups
        env:
          TEST_ONLY: ${{ inputs.test_only }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$TEST_ONLY" == 'true' ]]; then
            echo 'groups=[]' >> "$GITHUB_OUTPUT"
          else
            bash scripts/ci/test-groups.sh --list > groups.txt
            python3 -c 'import json,pathlib; g=pathlib.Path("groups.txt").read_text().splitlines(); assert g and len(g)==len(set(g)); print("groups="+json.dumps(g,separators=(",",":")))' >> "$GITHUB_OUTPUT"
          fi
  coverage-groups:
    env:
      CGO_ENABLED: "1"
    needs: coverage-plan
    if: ${{ inputs.test_only != true }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: ${{ fromJSON(needs.coverage-plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.coverage-plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI assets
        run: cd ui && npm ci && npm run build
      - name: Prepare llama CPU libs
        run: bash scripts/hydrate-llama-cpu-libs.sh
      - name: Test and generate coverage for group
        env:
          TEST_GROUPS_ONLY: ${{ matrix.group }}
        run: bash scripts/ci/test-groups.sh coverage.raw.out coverage.out
      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.raw.out
          if-no-files-found: error
  coverage:
    name: Test and Coverage
    needs: [coverage-plan, coverage-groups, test]
    if: ${{ always() && inputs.test_only != true }}
    environment: ${{ github.event_name == 'push' && 'automatic-publishing' || 'admin-approved-actions' }}
    runs-on: ubuntu-latest
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      PLAN_RESULT: ${{ needs.coverage-plan.result }}
      GROUP_RESULT: ${{ needs.coverage-groups.result }}
      BUILD_RESULT: ${{ needs.test.result }}
    steps:
      - name: Require every coverage group
        run: test "$PLAN_RESULT" = success && test "$GROUP_RESULT" = success && test "$BUILD_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.coverage-plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage-parts
      - name: Merge and filter coverage profiles
        run: |
          set -euo pipefail
          printf 'mode: set\n' > coverage.raw.out
          for profile in coverage-parts/*/coverage.raw.out; do
            test "$(head -n 1 "$profile")" = 'mode: set'
            tail -n +2 "$profile" >> coverage.raw.out
          done
          bash scripts/generate-coverage.sh --filter coverage.raw.out coverage.out
      - name: Install goveralls
        if: ${{ env.COVERALLS_REPO_TOKEN != '' }}
        run: go install github.com/mattn/goveralls@latest
      - name: Upload coverage to Coveralls
        if: ${{ env.COVERALLS_REPO_TOKEN != '' }}
        run: '"$(go env GOPATH)/bin/goveralls" -coverprofile=coverage.out -service=github -repotoken="$COVERALLS_REPO_TOKEN"'
  make-test-shards:
    env:
      CGO_ENABLED: "1"
    needs: coverage-plan
    if: ${{ inputs.test_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [cypher, storage, server, storagecensus, capturecensus, command, other]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.coverage-plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI assets
        run: cd ui && npm ci && npm run build
      - name: Prepare llama CPU libs
        run: bash scripts/hydrate-llama-cpu-libs.sh
      - name: Check out trusted sharding helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-workflow-tools
          persist-credentials: false
      - name: Run package shard
        env:
          SHARD: ${{ matrix.shard }}
        run: bash .ci-workflow-tools/scripts/ci/make-test-shard.sh "$SHARD"
  make-test-lint:
    needs: coverage-plan
    if: ${{ inputs.test_only == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.coverage-plan.outputs.sha }}
          persist-credentials: false
      - run: make lint-slog lint-cardinality
  make-test:
    name: make test
    needs: [coverage-plan, make-test-shards, make-test-lint]
    if: ${{ always() && inputs.test_only == true }}
    environment: ${{ github.event_name == 'push' && 'automatic-publishing' || 'admin-approved-actions' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all shards and lint
        env:
          SHARD_RESULT: ${{ needs.make-test-shards.result }}
          LINT_RESULT: ${{ needs.make-test-lint.result }}
        run: test "$SHARD_RESULT" = success && test "$LINT_RESULT" = success
