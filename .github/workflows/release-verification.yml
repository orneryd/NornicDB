name: Release verification

# A same-repository release-to-main PR automatically runs full verification.
# The base-repository workflow is trusted; forked or non-release heads are excluded.
on:
  workflow_dispatch:
    inputs:
      head:
        description: Full commit SHA to verify
        required: true
        type: string
      base:
        description: Full ancestor commit SHA used as the verification baseline
        required: true
        type: string
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

# A new event for this PR supersedes its previous verification run.
concurrency:
  group: release-verification-${{ github.event.pull_request.number || inputs.head }}
  cancel-in-progress: true

jobs:
  authorize:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: admin-approved-actions
    runs-on: ubuntu-latest
    steps:
      - run: echo "Manual release verification authorized"
  prepare:
    needs: authorize
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && needs.authorize.result == 'success') || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/'))) }}
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.revisions.outputs.head }}
      base: ${{ steps.revisions.outputs.base }}
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact PR revisions
        id: revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD: ${{ inputs.head || github.event.pull_request.head.sha }}
          BASE_SHA: ${{ inputs.base || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            if [[ "$EVENT_NAME" != pull_request_target ]]; then
              echo "Manual verification requires an ancestor baseline." >&2
              exit 1
            fi
            if ! integrated_tree=$(git merge-tree --write-tree HEAD "$BASE_SHA") ||
               [[ "$integrated_tree" != "$(git rev-parse 'HEAD^{tree}')" ]]; then
              echo "The release head is missing changes from main or conflicts with it; sync main and verify again." >&2
              exit 1
            fi
          fi
          echo "head=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Discover all existing coverage groups
        id: groups
        run: |
          set -euo pipefail
          bash scripts/ci/test-groups.sh --list > groups.txt
          python3 -c 'import json,pathlib; g=pathlib.Path("groups.txt").read_text().splitlines(); assert g and len(g)==len(set(g)); shards=["cypher","storage","server","storagecensus","capturecensus","command","other"]; print("matrix="+json.dumps({"include":[{"kind":"coverage","item":x} for x in g]+[{"kind":"make-test","item":x} for x in shards]},separators=(",",":")))' >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Localization, UI, libraries and build
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
        run: make verify ALL=1 ONLY='localization ui llama-libs build' BASE="$BASE_SHA"
      - name: Build the local GGUF provider
        if: ${{ !cancelled() }}
        run: CGO_ENABLED=0 go build -tags 'noui,localllm,yzma' -o /tmp/nornicdb-yzma ./cmd/nornicdb
  tests:
    name: ${{ matrix.kind }} / ${{ matrix.item }}
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    env:
      CGO_ENABLED: "1"
    needs: prepare
    # Only the trusted, same-repository release head reaches this job.
    # Route Cypher and storage census coverage and make-test shards to the local runner.
    runs-on: ${{ (matrix.item == 'cypher' || matrix.item == 'storagecensus') && 'nornic-trusted' || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare UI assets
        run: |
          (cd ui && npm ci && npm run build)
      - name: Prepare llama libraries
        if: ${{ matrix.item != 'cypher' && matrix.item != 'storagecensus' }}
        run: |
          bash scripts/hydrate-llama-cpu-libs.sh
      - name: Prepare pinned llama libraries from runner
        if: ${{ matrix.item == 'cypher' || matrix.item == 'storagecensus' }}
        run: |
          cmp lib/llama/CPU_IMAGE_DIGEST /opt/nornic-llama/CPU_IMAGE_DIGEST
          cp /opt/nornic-llama/libllama_linux_amd64.a lib/llama/
          cp -a /opt/nornic-llama/include/. lib/llama/
      - name: Scope trusted-runner Go files to the job
        if: ${{ matrix.item == 'cypher' || matrix.item == 'storagecensus' }}
        run: |
          set -euo pipefail
          # The runner cleans RUNNER_TEMP between jobs, including interrupted jobs.
          mkdir -p "$RUNNER_TEMP/nornic-go/cache" "$RUNNER_TEMP/nornic-go/tmp"
          {
            printf 'GOCACHE=%s/nornic-go/cache\n' "$RUNNER_TEMP"
            printf 'TMPDIR=%s/nornic-go/tmp\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Run coverage group
        if: ${{ matrix.kind == 'coverage' }}
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          TEST_GROUP: ${{ matrix.item }}
        run: make verify ALL=1 ONLY=tests GROUPS="$TEST_GROUP" BASE="$BASE_SHA"
      - name: Check out trusted sharding helper
        if: ${{ matrix.kind == 'make-test' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-workflow-tools
          persist-credentials: false
      - name: Run make test package shard
        if: ${{ matrix.kind == 'make-test' }}
        env:
          SHARD: ${{ matrix.item }}
        run: bash .ci-workflow-tools/scripts/ci/make-test-shard.sh "$SHARD"
      # The trusted runner can briefly lose DNS or the artifact connection
      # after coverage has passed. Retry transport failures, with distinct
      # artifact names in case an earlier attempt created a partial upload.
      - name: Upload coverage logs (attempt 1)
        id: coverage_logs_1
        if: ${{ !cancelled() && matrix.kind == 'coverage' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-coverage-${{ matrix.item }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verify/runs/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Pause before coverage log retry
        if: ${{ !cancelled() && matrix.kind == 'coverage' && steps.coverage_logs_1.outcome == 'failure' }}
        run: sleep 15
      - name: Upload coverage logs (attempt 2)
        id: coverage_logs_2
        if: ${{ !cancelled() && matrix.kind == 'coverage' && steps.coverage_logs_1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-coverage-${{ matrix.item }}-${{ github.run_id }}-${{ github.run_attempt }}-retry-2
          path: .verify/runs/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Pause before final coverage log retry
        if: ${{ !cancelled() && matrix.kind == 'coverage' && steps.coverage_logs_2.outcome == 'failure' }}
        run: sleep 30
      - name: Upload coverage logs (final attempt)
        if: ${{ !cancelled() && matrix.kind == 'coverage' && steps.coverage_logs_2.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-coverage-${{ matrix.item }}-${{ github.run_id }}-${{ github.run_attempt }}-retry-3
          path: .verify/runs/
          include-hidden-files: true
          if-no-files-found: warn
  lint:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - run: make lint-slog lint-cardinality
  checks:
    env:
      CGO_ENABLED: "1"
    needs: [prepare, build, lint]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        check: [allocations, conformance, differential, docs, differential-ratchet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare llama CPU libs for conformance and differential tests
        if: ${{ matrix.check == 'conformance' || matrix.check == 'differential' || matrix.check == 'differential-ratchet' }}
        run: bash scripts/hydrate-llama-cpu-libs.sh
      - name: Run verification check
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          CHECK: ${{ matrix.check }}
        run: |
          set -o pipefail
          if [[ "$CHECK" == differential-ratchet ]]; then
            mkdir -p .verify/ratchet
            make cypher-differential-ratchet 2>&1 | tee .verify/ratchet/differential-ratchet.log
          else
            make verify ALL=1 ONLY="$CHECK" BASE="$BASE_SHA"
          fi
      - name: Upload verification logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .verify/runs/
            .verify/ratchet/
          if-no-files-found: warn
          include-hidden-files: true
  verify:
    name: Release verification (required)
    needs: [prepare, build, tests, lint, checks]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os,sys; results=json.loads(os.environ["RESULTS"]); failed={k:v["result"] for k,v in results.items() if v["result"] != "success"}; print("Verification results:", {k:v["result"] for k,v in results.items()}); sys.exit(bool(failed))'
