name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - docs-site/**
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs Site
    # Manual and reusable runs wait for an administrator before allocating a runner.
    environment: ${{ github.event_name == 'push' && 'automatic-publishing' || 'admin-approved-actions' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs-site/requirements-graph.txt

      - name: Install docs dependencies
        run: |
          pip install -r docs-site/requirements-graph.txt
          npm ci --prefix docs-site

      - name: Extract and reduce the current code graph
        working-directory: docs-site
        env:
          GRAPHIFY_OUTPUT: ${{ runner.temp }}/docs-graphify
        run: |
          npm run graph
          python tools/extract-graphify.py
          python tools/import-graphify.py

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build and verify current documentation
        working-directory: docs-site
        env:
          VITE_DOCS_API_ORIGIN: ${{ vars.DOCS_API_ORIGIN }}
        run: |
          npm run build
          npm test
          go test ./tools/source-graph
          python -m unittest discover -s tools -p 'test_*.py'

      - name: Verify browser journeys and an archived release
        working-directory: docs-site
        run: |
          npm run build:version -- v1.4.3
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Build tagged documentation without semantic indexes
        working-directory: docs-site
        run: |
          for tag in $(git tag --list 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -3); do
            if [ ! -f ".vitepress/dist/versions/$tag/index.html" ]; then
              npm run build:version -- "$tag"
            fi
          done

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy Docs Site
    # Manual and reusable runs wait for an administrator before allocating a runner.
    environment: ${{ github.event_name == 'push' && 'automatic-publishing' || 'admin-approved-actions' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
