name: Release Graphify ingestion

on:
  pull_request_target:
    branches: ['release/**']
    types: [closed]
  workflow_dispatch:
    inputs:
      branch:
        description: Release branch to refresh
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-graphify-rolling-index
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out trusted default-branch workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select release branch
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/graphify_ingest_gate.py
      - name: Check out the current release head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.branch }}
          path: release-tools
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install trusted release tooling
        run: python -m pip install -r release-tools/scripts/requirements-code-intelligence.txt
      - name: Trust the configured database certificate
        env:
          NORNICDB_CA_PEM: ${{ secrets.NORNICDB_CA_PEM }}
        run: python .github/scripts/graphify_tls.py
      - name: Refresh the rolling release code graph
        env:
          TRUSTED_RELEASE_ROOT: ${{ github.workspace }}/release-tools
          RELEASE_BRANCH: ${{ steps.gate.outputs.branch }}
          NORNICDB_URI: ${{ secrets.NORNICDB_URI }}
          NORNICDB_USER: ${{ secrets.NORNICDB_USER }}
          NORNICDB_PASSWORD: ${{ secrets.NORNICDB_PASSWORD }}
          NORNICDB_DATABASE: ${{ vars.NORNICDB_DATABASE || 'nornicdbcode' }}
        run: python .github/scripts/graphify_ci.py ingest
