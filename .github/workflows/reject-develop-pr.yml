name: Reject pull requests to develop

# Repository policy permits direct integration on develop, not pull requests.
# This is governance only: never check out or execute pull-request code.
on:
  pull_request_target:
    branches:
      - develop
    types:
      - opened
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    name: Close pull request targeting develop
    runs-on: ubuntu-latest
    steps:
      - name: Close the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f state=closed >/dev/null
