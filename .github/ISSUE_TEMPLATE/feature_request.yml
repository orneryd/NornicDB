name: Feature request
description: Suggest a capability or improvement.
title: '[FEATURE] '
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: Thanks for helping improve NornicDB! Search existing issues first. Share only what you know;
      never include passwords, API keys, private data, or sensitive logs.
- type: textarea
  id: problem
  attributes:
    label: Problem and impact
    description: What is broken, missing, or difficult? Who is affected and how?
  validations:
    required: true
- type: textarea
  id: journey
  attributes:
    label: User journey
    description: Describe a concrete workflow and who would benefit.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Desired outcome
    description: What should be possible? Give examples or observable outcomes that would show it works.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Workarounds or alternatives
    description: What have you tried, and did it help? Other ideas are welcome.
- type: textarea
  id: matrix
  attributes:
    label: Scenarios to check
    description: If known, give examples or situations the capability should support.
- type: textarea
  id: environment
  attributes:
    label: Environment or compatibility
    description: If relevant, include your version, deployment, client, and a reference to existing behavior
      in another product.
- type: textarea
  id: implementation
  attributes:
    label: Possible implementation areas
    description: 'Optional: suggest affected components or an approach if you know them. A proposed solution
      is not required.'
- type: textarea
  id: related
  attributes:
    label: Related work and context
    description: Link related issues, discussions, documentation, or reference behavior.
