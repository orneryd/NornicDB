services:
  nornicdb:
    build:
      context: ./nornicdb
      dockerfile: docker/Dockerfile.arm64-metal
      args:
        EMBED_MODEL: "true" # Include bge-m3.gguf in image
      tags:
        - timothyswt/nornicdb-arm64-metal-bge:latest
    image: timothyswt/nornicdb-arm64-metal-bge:latest
    container_name: nornicdb
    volumes:
      - ./data/movies-test:/data
    ports:
      - "${NORNICDB_HTTP_PORT:-7474}:${NORNICDB_HTTP_PORT:-7474}" # HTTP API & Browser UI
      - "${NORNICDB_HTTPS_PORT:-7473}:${NORNICDB_HTTPS_PORT:-7473}" # Native HTTPS API
      - "${NORNICDB_BOLT_PORT:-7687}:${NORNICDB_BOLT_PORT:-7687}" # Bolt protocol (Neo4j compatible)
    environment:
      - NORNICDB_DATA_DIR=/data
      - NORNICDB_ADDRESS=${NORNICDB_ADDRESS:-0.0.0.0}
      - NORNICDB_BASE_PATH=${NORNICDB_BASE_PATH:-}
      - NORNICDB_AUTH=${NORNICDB_AUTH:-}
      - NORNICDB_AUTH_JWT_SECRET=${NORNICDB_AUTH_JWT_SECRET:-}
      - NORNICDB_AUTH_PROVIDER=${NORNICDB_AUTH_PROVIDER:-}
      - NORNICDB_AUTH_TOKEN_EXPIRY=${NORNICDB_AUTH_TOKEN_EXPIRY:-}
      - NORNICDB_MIN_PASSWORD_LENGTH=${NORNICDB_MIN_PASSWORD_LENGTH:-}
      - NORNICDB_NO_AUTH=${NORNICDB_NO_AUTH:-true}
      - NORNICDB_OAUTH_ISSUER=${NORNICDB_OAUTH_ISSUER:-}
      - NORNICDB_OAUTH_CLIENT_ID=${NORNICDB_OAUTH_CLIENT_ID:-}
      - NORNICDB_OAUTH_CLIENT_SECRET=${NORNICDB_OAUTH_CLIENT_SECRET:-}
      - NORNICDB_OAUTH_CALLBACK_URL=${NORNICDB_OAUTH_CALLBACK_URL:-}
      - NORNICDB_CORS_ENABLED=${NORNICDB_CORS_ENABLED:-}
      - NORNICDB_CORS_ORIGINS=${NORNICDB_CORS_ORIGINS:-}
      - NORNICDB_TRACE_GRAPHQL=${NORNICDB_TRACE_GRAPHQL:-}
      - NORNICDB_HTTP_ENABLED=${NORNICDB_HTTP_ENABLED:-}
      - NORNICDB_HTTP_PORT=${NORNICDB_HTTP_PORT:-7474}
      - NORNICDB_HTTP_ADDRESS=${NORNICDB_HTTP_ADDRESS:-}
      - NORNICDB_HTTP_TRUSTED_PROXIES=${NORNICDB_HTTP_TRUSTED_PROXIES:-}
      - NORNICDB_HTTPS_ENABLED=${NORNICDB_HTTPS_ENABLED:-}
      - NORNICDB_HTTPS_PORT=${NORNICDB_HTTPS_PORT:-7473}
      - NORNICDB_HTTP_TLS_CERT=${NORNICDB_HTTP_TLS_CERT:-}
      - NORNICDB_HTTP_TLS_KEY=${NORNICDB_HTTP_TLS_KEY:-}
      - NORNICDB_BOLT_ENABLED=${NORNICDB_BOLT_ENABLED:-}
      - NORNICDB_BOLT_PORT=${NORNICDB_BOLT_PORT:-7687}
      - NORNICDB_BOLT_ADDRESS=${NORNICDB_BOLT_ADDRESS:-}
      - NORNICDB_BOLT_SERVER_ANNOUNCEMENT=${NORNICDB_BOLT_SERVER_ANNOUNCEMENT:-}
      - NORNICDB_BOLT_TLS_ENABLED=${NORNICDB_BOLT_TLS_ENABLED:-}
      - NORNICDB_BOLT_TLS_REQUIRE=${NORNICDB_BOLT_TLS_REQUIRE:-}
      - NORNICDB_BOLT_TLS_CERT=${NORNICDB_BOLT_TLS_CERT:-}
      - NORNICDB_BOLT_TLS_KEY=${NORNICDB_BOLT_TLS_KEY:-}
      - NORNICDB_BOLT_TLS_CLIENT_CA=${NORNICDB_BOLT_TLS_CLIENT_CA:-}
      - NORNICDB_BOLT_TLS_CLIENT_AUTH_MODE=${NORNICDB_BOLT_TLS_CLIENT_AUTH_MODE:-}
      - NORNICDB_BOLT_SNIFF_TIMEOUT=${NORNICDB_BOLT_SNIFF_TIMEOUT:-}
      - NORNICDB_BOLT_AUTH_TIMEOUT=${NORNICDB_BOLT_AUTH_TIMEOUT:-}
      - NORNICDB_BOLT_STATEMENT_TIMEOUT=${NORNICDB_BOLT_STATEMENT_TIMEOUT:-}
      - NORNICDB_BOLT_WEBSOCKET_ENABLED=${NORNICDB_BOLT_WEBSOCKET_ENABLED:-}
      - NORNICDB_BOLT_WEBSOCKET_ALLOWED_ORIGINS=${NORNICDB_BOLT_WEBSOCKET_ALLOWED_ORIGINS:-}
      - NORNICDB_BOLT_WEBSOCKET_MAX_MESSAGE_SIZE=${NORNICDB_BOLT_WEBSOCKET_MAX_MESSAGE_SIZE:-}
      - NORNICDB_BOLT_WEBSOCKET_WRITE_BUFFER_SIZE=${NORNICDB_BOLT_WEBSOCKET_WRITE_BUFFER_SIZE:-}
      - NORNICDB_BOLT_WEBSOCKET_PING_INTERVAL=${NORNICDB_BOLT_WEBSOCKET_PING_INTERVAL:-}
      - NORNICDB_BOLT_WEBSOCKET_PONG_TIMEOUT=${NORNICDB_BOLT_WEBSOCKET_PONG_TIMEOUT:-}
      - NORNICDB_TLS_DIR=${NORNICDB_TLS_DIR:-}
      - NORNICDB_QDRANT_GRPC_ENABLED=${NORNICDB_QDRANT_GRPC_ENABLED:-false}
      - NORNICDB_QDRANT_GRPC_LISTEN_ADDR=${NORNICDB_QDRANT_GRPC_LISTEN_ADDR:-0.0.0.0:6334}
      - NORNICDB_QDRANT_GRPC_MAX_VECTOR_DIM=${NORNICDB_QDRANT_GRPC_MAX_VECTOR_DIM:-4096}
      - NORNICDB_QDRANT_GRPC_MAX_BATCH_POINTS=${NORNICDB_QDRANT_GRPC_MAX_BATCH_POINTS:-1000}
      - NORNICDB_QDRANT_GRPC_MAX_TOP_K=${NORNICDB_QDRANT_GRPC_MAX_TOP_K:-1000}
      - NORNICDB_QDRANT_GRPC_TLS_ENABLED=${NORNICDB_QDRANT_GRPC_TLS_ENABLED:-false}
      - NORNICDB_QDRANT_GRPC_TLS_CERT=${NORNICDB_QDRANT_GRPC_TLS_CERT:-}
      - NORNICDB_QDRANT_GRPC_TLS_KEY=${NORNICDB_QDRANT_GRPC_TLS_KEY:-}
      - NORNICDB_QDRANT_GRPC_TLS_CLIENT_CA=${NORNICDB_QDRANT_GRPC_TLS_CLIENT_CA:-}
      - NORNICDB_QDRANT_GRPC_TLS_CLIENT_AUTH_MODE=${NORNICDB_QDRANT_GRPC_TLS_CLIENT_AUTH_MODE:-none}
      # Embedding configuration - llama.cpp OpenAI-compatible API
      # - NORNICDB_HEIMDALL_ENABLED=true
      - NORNICDB_AUTO_TLP_ENABLED=false
      # - NORNICDB_KMEANS_CLUSTERING_ENABLED=true
      - NORNICDB_EMBEDDING_PROVIDER=local
      - GOGC=50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mcp_network
    deploy:
      resources:
        limits:
          memory: 2GB
        reservations:
          memory: 1GB
networks:
  mcp_network:
    driver: bridge
