syntax = "proto3";

package nornicdb.grpc.v1;

option go_package = "github.com/orneryd/nornicdb/pkg/nornicgrpc/gen;gen";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// NornicSearch is a NornicDB-native gRPC API for high-performance, typed search.
//
// This is additive to the Qdrant-compatible gRPC endpoint: it does not affect
// Qdrant client compatibility and enables NornicDB-exclusive features like
// "search by text" (server-side query embedding when enabled).
service NornicSearch {
  // SearchText performs hybrid search (vector + BM25) when embeddings are enabled,
  // falling back to text-only search when embeddings are unavailable.
  rpc SearchText(SearchTextRequest) returns (SearchTextResponse);
}

message SearchTextRequest {
  // Optional database name; empty uses the server default database.
  string database = 1;

  // Query text. When embeddings are enabled, the server embeds this query and
  // uses hybrid ranking (vector + BM25). Otherwise, BM25-only is used.
  string query = 2;

  // Max number of results to return (server clamps to a configured maximum).
  uint32 limit = 3;

  // Optional label/type filter (matches the behavior of /nornicdb/search).
  repeated string labels = 4;

  // Optional similarity threshold for vector search. When unset, the server's
  // configured default threshold applies.
  optional float min_similarity = 5;

  // Opaque signed result-stream token returned by a partial page. Empty starts
  // a new search. The token is bound to the authenticated owner and database.
  string qid = 6;

  // Maximum logical results to return from this start or pull operation. This
  // is a page size, not the ranked retrieval depth or lifetime result ceiling.
  uint32 n = 7;

  // Release the complete stream identified by qid without returning records.
  bool discard = 8;

  // Optional caller-selected cumulative result ceiling. Zero means no caller ceiling.
  optional uint64 max_results = 9;

  // Continuation mode: ranked progressively deepens ranked retrieval;
  // ranked_then_id emits a ranked prefix then the eligible catalogue; id
  // bypasses ranking and enumerates the eligible catalogue.
  string mode = 10;

  // Optional flat nonempty UTF-8 string property used to collapse eligible
  // child records into logical assets before pagination.
  string group_by = 11;

  // Optional fixed ranked-prefix boundary for ranked_then_id mode.
  optional uint64 ranked_limit = 12;
}

message SearchHit {
  string node_id = 1;
  repeated string labels = 2;
  google.protobuf.Struct properties = 3;

  // Unified score used for ranking (usually RRF score for hybrid search).
  float score = 4;

  // Optional metadata for explainability/diagnostics.
  float rrf_score = 5;
  int32 vector_rank = 6;
  int32 bm25_rank = 7;
  string phase = 8;
  // Logical property value when group_by was requested.
  string group_key = 9;
  // Matching child results. One parent hit consumes one page slot regardless
  // of the number of passages. Child passages use the same SearchHit shape as
  // top-level hits so per-hit metadata survives grouped serialization.
  repeated SearchHit passages = 10;
}

message SearchTextResponse {
  string search_method = 1;
  repeated SearchHit hits = 2;
  bool fallback_triggered = 3;
  string message = 4;
  double time_seconds = 5;
  // Token for the next position; empty when exhausted or released.
  string qid = 6;
  bool has_more = 7;
  uint64 position = 8;
  uint32 returned = 9;
  // Known for complete modes; omitted while progressive ranked cardinality is unknown.
  optional uint64 total = 10;
  google.protobuf.Timestamp expires_at = 11;
  bool released = 12;
  string mode = 13;
  int64 ranked_count = 14;
  optional int64 eligible_count = 15;
  // True only when the ranked branch is known to be fully exhausted without
  // truncating a candidate prefix.
  bool ranked_pool_exhausted = 16;
  bool collection_exhausted = 17;
  // more_results, candidate_pool_exhausted, eligible_population_exhausted, or
  // max_results_reached.
  // eligible_population_exhausted means the complete eligible population was
  // emitted, including a ranked stream that naturally exhausted an exact
  // producer.
  // candidate_pool_exhausted means a configured candidate boundary stopped
  // ranked expansion without proving full ranked exhaustion.
  // max_results_reached means the caller's explicit result ceiling stopped the
  // stream before full collection exhaustion.
  string completion = 18;
  // Stable sanitized reason the selected path differed from hybrid search.
  string fallback_reason = 19;
}
