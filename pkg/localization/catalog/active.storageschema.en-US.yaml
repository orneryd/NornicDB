- id: storageschema.constraint_already_exists
  description: Schema constraint creation conflict. Name is an untranslated constraint identifier.
  other: 'constraint "{{.Name}}" already exists'
- id: storageschema.constraint_different_allowed_values
  description: Domain constraint name conflict. Name is an untranslated constraint identifier.
  other: 'constraint "{{.Name}}" already exists with different allowed values'
- id: storageschema.constraint_different_max_count
  description: Cardinality constraint name conflict. Name is an untranslated constraint identifier.
  other: 'constraint "{{.Name}}" already exists with different max count ({{.ExistingMaxCount}} vs {{.RequestedMaxCount}})'
- id: storageschema.constraint_different_schema_or_type
  description: Constraint name conflict across schemas or types. Name is untranslated.
  other: 'constraint "{{.Name}}" already exists with different schema or type'
- id: storageschema.conflicting_policy
  description: Relationship policy conflict. Labels, relationship type, and constraint name are untranslated identifiers.
  other: 'conflicting policy: cannot have both ALLOWED and DISALLOWED for {{.SourceLabel}}-[:{{.RelationshipType}}]->{{.TargetLabel}} (constraint "{{.ExistingName}}")'
- id: storageschema.conflicting_domain_constraint
  description: Domain constraint conflict. Name is an untranslated constraint identifier.
  other: 'conflicting domain constraint "{{.Name}}" already exists on same schema with different allowed values'
- id: storageschema.conflicting_cardinality_constraint
  description: Cardinality constraint conflict. Name, direction, and label are untranslated identifiers.
  other: 'conflicting cardinality constraint "{{.Name}}" already exists on {{.Direction}} {{.Label}} with max count {{.ExistingMaxCount}} (new: {{.RequestedMaxCount}})'
- id: storageschema.equivalent_constraint_already_exists
  description: Equivalent constraint conflict. Name is an untranslated constraint identifier.
  other: 'equivalent constraint "{{.Name}}" already exists on same schema'
- id: storageschema.conflicting_constraint_already_exists
  description: Incompatible constraint conflict. Name is an untranslated constraint identifier.
  other: 'conflicting constraint "{{.Name}}" already exists on same schema'
- id: storageschema.unique_constraint_violation
  description: Unique constraint violation. Label, property, and value are untranslated data.
  other: "Node({{.Label}}) already exists with {{.Property}} = {{.Value}}"
- id: storageschema.composite_index_min_properties
  description: Composite index validation with the supplied property count.
  other: composite index requires at least 2 properties, got {{.Count}}
- id: storageschema.range_index_properties_required
  description: Range index validation when no properties are supplied.
  other: range index requires at least one property
- id: storageschema.range_index_not_found
  description: Missing range index. Name is an untranslated index identifier.
  other: range index {{.Name}} not found
- id: storageschema.range_index_numeric_value_required
  description: Range index validation for a nonnumeric value. Type is an untranslated Go type.
  other: range index only supports numeric values, got {{.Type}}
- id: storageschema.index_not_found
  description: Missing schema index. Name is an untranslated index identifier.
  other: 'index "{{.Name}}" does not exist'
- id: storageschema.constraint_not_found
  description: Missing schema constraint. Name is an untranslated constraint identifier.
  other: 'constraint "{{.Name}}" does not exist'
- id: storageschema.property_index_not_found
  description: Missing property index. Label and property are untranslated identifiers.
  other: property index {{.Label}}:{{.Property}} not found
- id: storageschema.decay_profile_bundle_already_exists
