  other: "[!! NórnícDB - Hígh-Pérfórmáncé Gráph Dátábásé fór LLM Ágénts !!]"
- id: nornicdbcli.root.long
  other: |-
    [!! NórnícDB ís á púrpósé-búílt gráph dátábásé wríttén ín Gó,
    désígnéd fór ÁÍ ágént mémóry wíth Néó4j Bólt/Cýphér cómpátíbílítý.

    Féátúrés:
      • Néó4j Bólt prótócól cómpátíbílítý
      • Cýphér qúérý lángúágé súppórt
      • Knówlédgé-láýér scóríng wíth déclárátívé décáý prófílés
      • Áútómátíc rélátíónshíp ínféréncé
      • Búílt-ín véctór séárch wíth RRF hýbríd ránkíng
      • Sérvér-sídé émbéddíng générátíón !!]
