- id: search.hnsw_index_creation_failed
  description: Error al crear un índice HNSW. Cause no se traduce.
  other: "no se pudo crear el índice HNSW: {{.Cause}}"
- id: search.vector_index_nil
  description: Error de inicialización cuando no existe el índice vectorial.
  other: el índice vectorial es nulo
