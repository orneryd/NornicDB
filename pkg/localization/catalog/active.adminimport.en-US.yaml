- id: adminimport.open_csv_failed
  description: Admin import CLI failure while opening a CSV source. The appended cause is diagnostic text and is not translated.
  other: failed to open CSV file
- id: adminimport.database_name_required
  description: Admin import validation when the target database name is absent.
  other: database name is required
- id: adminimport.node_source_required
  description: Admin import validation when no node CSV source is supplied. --nodes is a machine flag and is not translated.
  other: at least one --nodes source is required
- id: adminimport.storage_engine_required
  description: Embedded admin import validation when no storage engine is supplied.
  other: storage engine is required
- id: adminimport.actual_id_unsupported
  description: Admin import validation for the unsupported actual ID mode. The flag and value are machine identifiers.
  other: --id-type=actual is not supported
- id: adminimport.relationship_ids_required
  description: Admin import validation for missing relationship endpoint columns. Column tokens are machine identifiers.
  other: relationship source requires :START_ID and :END_ID columns
- id: adminimport.relationship_type_required
  description: Admin import validation for a missing relationship type. Column and flag syntax are machine identifiers.
  other: relationship source requires :TYPE column or --relationships=TYPE= prefix
- id: adminimport.invalid_vector_dimensions
  description: Admin import validation for invalid vector dimensions. Header is the untranslated CSV header.
  other: "invalid vector dimensions in header: {{.Header}}"
- id: adminimport.unsupported_header_token
  description: Admin import validation for an unsupported CSV header token. Token is not translated.
  other: "unsupported header token: {{.Token}}"
- id: adminimport.unsupported_property_type
  description: Admin import validation for an unsupported property type. Type is a machine identifier.
  other: "unsupported property type: {{.Type}}"
- id: adminimport.empty_source
  description: Admin import validation for an empty source specification.
  other: empty import source
- id: adminimport.relationship_prefix_limit
  description: Admin import validation when a relationship source has multiple type prefixes.
  other: relationship source accepts at most one type prefix
- id: adminimport.custom_quote_unsupported
  description: Admin import validation for unsupported CSV quote configuration. --quote is a machine flag.
  other: custom --quote is not supported by the Go CSV reader yet
- id: adminimport.zip_single_file_required
  description: Admin import validation when a zip CSV source contains the wrong number of files.
  other: zip CSV sources must contain exactly one file
- id: adminimport.target_not_empty
  description: Admin import validation when a full import targets a nonempty database.
  other: database import full requires an empty target database
- id: adminimport.no_csv_files
  description: Admin import validation when source discovery finds no compatible CSV files.
  other: no Neo4j-compatible CSV files found in source directory
- id: adminimport.no_node_csv_files
  description: Admin import validation when source discovery finds no node CSV files.
  other: source directory does not contain any node CSV files
- id: adminimport.export_output_directory_required
  description: Admin export validation when no output directory is supplied.
  other: output directory is required
- id: adminimport.export_custom_quote_unsupported
  description: Admin export validation for unsupported quote characters.
  other: custom quote characters are not supported for Neo4j CSV export
- id: adminimport.unsupported_csv_header
  description: Admin import source discovery failure. Path is not translated.
  other: "unsupported CSV header in Neo4j source directory: {{.Path}}"
- id: adminimport.schema_application_failed
  description: Admin import failure while applying the post-load schema. The appended cause is not translated.
  other: schema application failed
- id: adminimport.duplicate_node_id
  description: Admin import duplicate node identifier failure. Row is the one-based CSV row.
  other: "duplicate node ID at row {{.Row}}"
- id: adminimport.duplicate_relationship_id
  description: Admin import duplicate relationship identifier failure. The appended cause is not translated.
  other: duplicate relationship ID
- id: adminimport.duplicate_relationship_id_at_row
  description: Admin import duplicate relationship identifier failure. Row is the one-based CSV row.
  other: "duplicate relationship ID at row {{.Row}}"
- id: adminimport.bad_start_relationship
  description: Admin import relationship failure caused by a missing start node.
  other: "bad relationship at row {{.Row}}: missing start node"
- id: adminimport.bad_end_relationship
  description: Admin import relationship failure caused by a missing end node.
  other: "bad relationship at row {{.Row}}: missing end node"
- id: adminimport.bad_start_tolerance_exceeded
  description: Admin import tolerance failure caused by a missing start node.
  other: "bad relationship tolerance exceeded at row {{.Row}} ({{.BadCount}} > {{.Tolerance}}): missing start node"
- id: adminimport.bad_end_tolerance_exceeded
  description: Admin import tolerance failure caused by a missing end node.
  other: "bad relationship tolerance exceeded at row {{.Row}} ({{.BadCount}} > {{.Tolerance}}): missing end node"
- id: adminimport.open_gzip_csv_failed
  description: Admin import failure while opening a gzip CSV source. The appended cause is not translated.
  other: failed to open gzip CSV file
- id: adminimport.open_zip_csv_failed
  description: Admin import failure while opening a zip CSV source. The appended cause is not translated.
  other: failed to open zip CSV file
- id: adminimport.open_zip_member_failed
  description: Admin import failure while opening the CSV member in a zip source. The appended cause is not translated.
  other: failed to open zipped CSV member
- id: adminimport.csv_parse_error
  description: Admin import CSV parse failure. Where contains an untranslated path plus row and column coordinates; the appended cause is not translated.
  other: "CSV parse error at {{.Where}}"
- id: adminimport.scan_directory_failed
  description: Admin import source-discovery failure. The appended cause is not translated.
  other: failed to scan Neo4j CSV directory
- id: adminimport.read_header_failed
  description: Admin import failure while reading a CSV header. The appended cause is not translated.
  other: failed to read CSV header
