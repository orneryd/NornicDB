- id: cypheradmin.database_manager_unavailable
  description: Error de comando administrativo de Cypher. Command no se traduce.
  other: "el administrador de bases de datos no está disponible; {{.Command}} requiere compatibilidad con varias bases de datos"
- id: cypheradmin.invalid_syntax
  description: Error de sintaxis administrativa de Cypher. Command no se traduce.
  other: "sintaxis de {{.Command}} no válida"
- id: cypheradmin.database_name_expected
  description: Falta el nombre de la base de datos. Command no se traduce.
  other: "sintaxis de {{.Command}} no válida: se esperaba el nombre de la base de datos"
- id: cypheradmin.database_name_empty
  description: Nombre de base de datos vacío. Command no se traduce.
  other: "sintaxis de {{.Command}} no válida: el nombre de la base de datos no puede estar vacío"
- id: cypheradmin.invalid_database_name
  description: Nombre de base de datos no válido. Database no se traduce.
  other: "nombre de base de datos no válido: '{{.Database}}' (no puede contener espacios en blanco)"
- id: cypheradmin.database_already_exists
  description: Conflicto al crear una base de datos. Database no se traduce.
  other: "la base de datos '{{.Database}}' ya existe"
- id: cypheradmin.create_database_failed
  description: Error al crear una base de datos. Database y Cause no se traducen.
  other: "no se pudo crear la base de datos '{{.Database}}': {{.Cause}}"
- id: cypheradmin.invalid_identifier
  description: Identificador de Cypher no válido. Identifier no se traduce.
  other: "identificador {{.Identifier}} no válido: no se admiten acentos graves anidados"
- id: cypheradmin.database_does_not_exist
  description: Falta la base de datos que se va a eliminar. Database no se traduce.
  other: "la base de datos '{{.Database}}' no existe"
- id: cypheradmin.drop_database_failed
  description: Error al eliminar una base de datos. Database y Cause no se traducen.
  other: "no se pudo eliminar la base de datos '{{.Database}}': {{.Cause}}"
- id: cypheradmin.alias_name_expected
  description: Falta el nombre del alias. Command no se traduce.
  other: "sintaxis de {{.Command}} no válida: se esperaba el nombre del alias"
- id: cypheradmin.term_expected
  description: Falta un término del comando. Command y Term no se traducen.
  other: "sintaxis de {{.Command}} no válida: se esperaba {{.Term}}"
- id: cypheradmin.clause_expected
  description: Falta una cláusula del comando. Command y Clause no se traducen.
  other: "sintaxis de {{.Command}} no válida: se esperaba la cláusula {{.Clause}}"
- id: cypheradmin.alias_name_empty
  description: Nombre de alias vacío. Command no se traduce.
  other: "sintaxis de {{.Command}} no válida: el nombre del alias no puede estar vacío"
- id: cypheradmin.invalid_alias_name
  description: Nombre de alias no válido. Alias no se traduce.
  other: "nombre de alias no válido: '{{.Alias}}' (no puede contener espacios en blanco)"
- id: cypheradmin.create_alias_failed
  description: Error al crear un alias. Alias, Database y Cause no se traducen.
  other: "no se pudo crear el alias '{{.Alias}}' para la base de datos '{{.Database}}': {{.Cause}}"
- id: cypheradmin.alias_does_not_exist
  description: Falta el alias que se va a eliminar. Alias no se traduce.
  other: "el alias '{{.Alias}}' no existe"
- id: cypheradmin.drop_alias_failed
  description: Error al eliminar un alias. Alias y Cause no se traducen.
  other: "no se pudo eliminar el alias '{{.Alias}}': {{.Cause}}"
- id: cypheradmin.keyword_expected
  description: Falta una palabra clave. Command y Keyword no se traducen.
  other: "sintaxis de {{.Command}} no válida: se esperaba la palabra clave {{.Keyword}}"
- id: cypheradmin.database_not_found
  description: Error de búsqueda de base de datos. Database y Cause no se traducen.
  other: "no se encontró la base de datos '{{.Database}}': {{.Cause}}"
- id: cypheradmin.invalid_limits_type
  description: Tipo de límites inesperado devuelto por el administrador.
  other: el administrador de bases de datos devolvió un tipo de límites no válido
- id: cypheradmin.limit_assignment_expected
  description: Falta una asignación de límite de ALTER DATABASE.
  other: "sintaxis de ALTER DATABASE no válida: se esperaba una asignación de límite"
- id: cypheradmin.invalid_limit_assignment
  description: Asignación de límite no válida. Assignment y limit_name = value no se traducen.
  other: "sintaxis de asignación de límite no válida: se esperaba 'limit_name = value', se obtuvo '{{.Assignment}}'"
- id: cypheradmin.invalid_limit_value
  description: Valor de límite numérico no válido. Limit y Cause no se traducen.
  other: "valor de {{.Limit}} no válido: {{.Cause}}"
- id: cypheradmin.invalid_duration_limit_value
  description: Duración de límite no válida. Limit, los ejemplos y Cause no se traducen.
  other: "valor de {{.Limit}} no válido (se esperaba una duración como '60s' o '5m'): {{.Cause}}"
- id: cypheradmin.unknown_limit_name
  description: Clave de límite desconocida. Limit y Supported no se traducen.
  other: "nombre de límite desconocido: '{{.Limit}}' (admitidos: {{.Supported}})"
- id: cypheradmin.set_database_limits_failed
  description: Error al actualizar límites. Database y Cause no se traducen.
  other: "no se pudieron establecer los límites de la base de datos '{{.Database}}': {{.Cause}}"
- id: cypheradmin.transaction_ids_type
  other: "Se esperaba una cadena o una lista de cadenas, pero se obtuvo: {{.Value}}"
- id: cypheradmin.transaction_id_type
  other: "Se esperaba una cadena, pero se obtuvo: {{.Value}}"
- id: cypheradmin.variable_not_defined
  other: "Variable `{{.Variable}}` no definida"
- id: cypheradmin.show_transactions_invalid_input
  other: "Entrada no válida '{{.Input}}': se esperaba una cadena, una expresión, 'SHOW', 'TERMINATE', 'WHERE' o 'YIELD'"
- id: cypheradmin.terminate_transactions_invalid_input
  other: "Entrada no válida '{{.Input}}': se esperaba una cadena o una expresión"
- id: cypheradmin.show_clause_invalid
  other: "comando SHOW no válido: se esperaba WHERE, o YIELD [ORDER BY] [SKIP] [LIMIT] [WHERE] [RETURN]"
- id: cypheradmin.unsupported_administration_command
  other: "Comando de administración no admitido: {{.Command}}"
- id: cypheradmin.transaction_terminated
  other: "La transacción ha sido terminada. Reintente la operación en una nueva transacción y debería obtener un resultado correcto."
- id: cypheradmin.terminate_transactions_id_required
  other: "TERMINATE TRANSACTIONS requiere un id de transacción o una lista de ids de transacción"
- id: cypheradmin.transaction_id_unparseable
  other: "No se pudo analizar el id (formato esperado: <databasename>-transaction-<id>)"
- id: cypheradmin.transaction_id_database_name_length
  other: "El nombre de base de datos proporcionado debe tener una longitud de entre 3 y 63 caracteres."
- id: cypheradmin.database_option_unknown
  description: Opción de base de datos que Neo4j no define. Option no se traduce.
  other: "No se pudo crear la base de datos con las opciones indicadas: opción desconocida '{{.Option}}'"
- id: cypheradmin.database_option_unsupported
  description: Opción de base de datos de Neo4j que NornicDB no implementa. Option no se traduce.
  other: "NornicDB no admite la opción de base de datos '{{.Option}}'"
- id: cypheradmin.database_option_value
  description: Valor de opción de base de datos fuera de sus valores. Option, Value y Allowed no se traducen.
  other: "valor '{{.Value}}' no válido para la opción de base de datos '{{.Option}}': se esperaba uno de {{.Allowed}}"
- id: cypheradmin.database_options_unavailable
  description: El gestor de bases de datos no tiene opciones. Command no se traduce.
  other: "las opciones de base de datos no están disponibles: {{.Command}} requiere un gestor de bases de datos con opciones"
- id: cypheradmin.immutable_privilege_grant_forbidden
  description: Un GRANT IMMUTABLE con la autenticación activada. ASSIGN IMMUTABLE PRIVILEGE es sintaxis de privilegios de Neo4j y no se traduce.
  other: "No se puede conceder el permiso ASSIGN IMMUTABLE PRIVILEGE."
- id: cypheradmin.immutable_privilege_revoke_forbidden
  description: Un REVOKE de un privilegio inmutable con la autenticación activada.
  other: "Los privilegios inmutables no se pueden revocar."
- id: cypheradmin.privilege_role_not_found
  description: Un GRANT a un rol que no existe. Action (execute, execute_boosted) y Role no se traducen.
  other: "No se pudo conceder el privilegio {{.Action}} al rol '{{.Role}}': el rol no existe."
- id: cypheradmin.privilege_deny_role_not_found
  description: Un DENY a un rol que no existe. Action (impersonate) y Role no se traducen.
  other: "No se pudo denegar el privilegio {{.Action}} al rol '{{.Role}}': el rol no existe."
- id: cypheradmin.impersonation_system_update_denied
  description: Un comando de administración que modifica el sistema ejecutado suplantando a un usuario.
  other: "No se permite ejecutar comandos que modifican el sistema mientras se suplanta a un usuario."
- id: cypheradmin.impersonation_remote_database_denied
  description: Una sentencia o transacción que suplanta a un usuario en una base de datos remota o en una compuesta con un constituyente remoto. Database no se traduce.
  other: "No se admite suplantar a un usuario en la base de datos remota '{{.Database}}'."

- id: cypheradmin.system_graph_access_unsupported
  description: A graph or schema statement on the system database.
  other: "El acceso al grafo no se admite en la base de datos del sistema"
- id: cypheradmin.system_procedure_unsupported
  description: Una llamada a un procedimiento que no se ejecuta en la base de datos del sistema. Query es la sentencia sin traducir.
  other: "No es un comando ni un procedimiento de sistema reconocido. Este comando Cypher solo se puede ejecutar en una base de datos de usuario: {{.Query}}"
- id: cypheradmin.transaction_statement_type
  description: Incompatible statement types in an explicit transaction. Previous and Requested are Neo4j's untranslated statement type names.
  other: "Se intentó ejecutar {{.Requested}} después de ejecutar {{.Previous}}"

- id: cypheradmin.show_clause_unexpected
  description: Una cláusula tras el YIELD de un comando SHOW en la base de datos del sistema. Clause es la primera palabra clave de la cláusula, sin traducir; las palabras clave esperadas son sintaxis Cypher sin traducir.
  other: "Entrada no válida '{{.Clause}}': se esperaba ',', 'AS', 'ORDER BY', 'LIMIT', 'OFFSET', 'RETURN', 'SHOW', 'SKIP', 'TERMINATE', 'WHERE' o <EOF>"
- id: cypheradmin.show_expression_invalid
  description: Una subconsulta COUNT, EXISTS o COLLECT en un comando SHOW en la base de datos del sistema. Expression es la palabra clave sin traducir.
  other: "La expresión {{.Expression}} no es válida en los comandos SHOW."
- id: cypheradmin.show_pattern_comprehension_invalid
  description: Una comprensión de patrón en un comando SHOW en la base de datos del sistema.
  other: "Las comprensiones de patrón no son válidas en los comandos SHOW."
- id: cypheradmin.show_pattern_expression_invalid
  description: Una expresión de patrón en un comando SHOW en la base de datos del sistema.
  other: "Las expresiones de patrón no son válidas en los comandos SHOW."
