- id: localization.os_language_undetected
  description: Bootstrap warning emitted when the operating system language cannot be detected.
  other: "Unable to determine the operating system language; using English (United States)"
- id: localization.language_pack_missing
  description: Warning emitted once when a requested language pack is unavailable.
  other: "Language pack {{.RequestedLanguage}} is unavailable; using {{.ResolvedLanguage}} (source: {{.Source}})"
- id: localization.catalog_entry_missing
  description: Warning emitted when a translation is missing from an installed language pack.
  other: "Message {{.MessageID}} is unavailable in {{.Language}}; using English (United States)"
- id: server.invalid_request_body
  description: HTTP response for a malformed or unreadable request body.
  other: invalid request body
- id: server.method_post_required
  description: HTTP response for an endpoint that only accepts POST requests.
  other: POST required
- id: server.method_get_required
  description: HTTP response for an endpoint that only accepts GET requests.
  other: GET required
- id: server.method_get_or_post_required
  description: HTTP response for an endpoint that accepts GET or POST requests.
  other: GET or POST required
- id: server.method_get_or_put_required
  description: HTTP response for an endpoint that accepts GET or PUT requests.
  other: GET or PUT required
- id: server.method_not_allowed
  description: HTTP response when an endpoint does not accept the request method.
  other: method not allowed
- id: request.body_read_failed
  description: HTTP response when the server cannot read the request body.
  other: failed to read request body
- id: mcp.parse_error
  description: JSON-RPC error message for an invalid MCP request document.
  other: Parse error
- id: mcp.method_not_found
  description: JSON-RPC error message for an unsupported MCP method.
  other: Method not found
- id: mcp.tool_execution_failed
  description: JSON-RPC error message for an MCP tool execution failure.
  other: Tool execution failed
- id: qdrant.collection_name_required
  description: Qdrant gRPC validation error when the collection_name field is empty.
  other: collection_name is required
- id: qdrant.field_required
  description: Qdrant gRPC validation error when a request field is empty. Field is a machine field identifier and must not be translated.
  other: "{{.Field}} is required"
- id: qdrant.fields_required
  description: Qdrant gRPC validation error when plural request fields or values are empty. Fields is a machine identifier or phrase and must not be translated.
  other: "{{.Fields}} are required"
- id: qdrant.database_access_denied
  description: Qdrant gRPC authorization error when the principal cannot access a database. Name is the database identifier.
  other: 'access to database "{{.Name}}" is not allowed'
- id: qdrant.database_write_denied
  description: Qdrant gRPC authorization error when the principal cannot write to a database. Name is the database identifier.
  other: 'write on database "{{.Name}}" is not allowed'
- id: qdrant.permission_denied
  description: Qdrant gRPC authorization error when the principal lacks permission for an RPC method.
  other: permission denied
- id: qdrant.authentication_required
  description: Qdrant gRPC authentication error when credentials are missing. Cause is diagnostic text and must not be translated.
  other: "authentication required: {{.Cause}}"
- id: qdrant.invalid_or_expired_token
  description: Qdrant gRPC authentication error when a bearer token cannot be accepted.
  other: invalid or expired token
- id: qdrant.collection_not_found
  description: Qdrant gRPC lookup error when a collection does not exist. Name is the collection identifier.
  other: 'collection "{{.Name}}" not found'
- id: qdrant.snapshot_not_found
  description: Qdrant gRPC lookup error when a snapshot does not exist. Name is the snapshot identifier.
  other: 'snapshot "{{.Name}}" not found'
- id: localization.items_processed
  description: Test and shared progress message reporting a processed item count.
  one: "{{.Count}} item processed"
  other: "{{.Count}} items processed"
- id: security.not_authenticated
  description: Bolt failure returned when authentication has not completed.
  other: Not authenticated
- id: security.schema_permission_required
  description: Authorization failure for schema operations.
  other: Schema operations require schema permission
- id: security.admin_permission_required
  description: Authorization failure for administrator operations.
  other: Admin operations require admin permission
- id: security.write_permission_required
  description: Authorization failure for write operations.
  other: Write operations require write permission
- id: security.read_permission_required
  description: Authorization failure for read operations.
  other: Read operations require read permission
- id: database.not_found
  description: Database lookup failure. Name is the requested database identifier.
  other: "Database '{{.Name}}' does not exist"
- id: server.database_not_found
  description: Legacy HTTP and Neo4j response when the requested database does not exist. Name is the database identifier.
  other: "Database '{{.Name}}' not found"
- id: security.database_access_denied
  description: Authorization response when the principal cannot access a database. Name is the database identifier.
  other: "Access to database '{{.Name}}' is not allowed."
- id: security.database_write_denied
  description: Authorization response when the principal cannot write to a database. Name is the database identifier.
  other: "Write on database '{{.Name}}' is not allowed."
- id: server.authentication_not_configured
  description: HTTP response when authentication services are unavailable or disabled.
  other: authentication not configured
- id: server.not_authenticated
  description: HTTP response when a request has no authenticated principal.
  other: not authenticated
- id: server.user_not_found
  description: HTTP response when the requested user does not exist or cannot be disclosed.
  other: user not found
- id: server.transaction_not_found
  description: Neo4j HTTP response when the requested transaction does not exist or is not owned by the caller.
  other: transaction not found
- id: server.request_field_required
  description: HTTP validation response when a request field is empty. Field is a machine field identifier and must not be translated.
  other: "{{.Field}} is required"
- id: server.not_found
  description: Generic Neo4j HTTP response when a route or resource cannot be found.
  other: not found
- id: search.searcher_required
  description: gRPC service configuration error when no search implementation is supplied.
  other: searcher is required
- id: request.required
  description: Protocol validation error when a request payload is missing.
  other: request is required
- id: search.query_required
  description: Search validation error when the query is empty.
  other: query is required
- id: search.query_chunk_failed
  description: Search query chunking failure. Cause is diagnostic text from the underlying component.
  other: "failed to chunk query: {{.Cause}}"
- id: search.failed
  description: Search execution failure. Cause is diagnostic text from the underlying component.
  other: "search: {{.Cause}}"
