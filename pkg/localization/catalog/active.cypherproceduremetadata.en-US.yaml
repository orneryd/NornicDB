- id: cypherproceduremetadata.db_index_fulltext_querynodes
  other: "Query the given full-text index. Returns the matching nodes and their native fulltext query score, ordered by score.\nValid _key: value_ pairs for the `options` map are:\n\n* 'skip' -- to skip the top N results.\n* 'limit' -- to limit the number of results returned.\n* 'analyzer' -- to use the specified analyzer as a search analyzer for this query.\n\nThe `options` map and any of the keys are optional.\nAn example of the `options` map: `{skip: 30, limit: 10, analyzer: 'none'}`\n"
- id: cypherproceduremetadata.db_index_fulltext_queryrelationships
  other: "Query the given full-text index. Returns the matching relationships and their native fulltext query score, ordered by score.\nValid _key: value_ pairs for the `options` map are:\n\n* 'skip' -- to skip the top N results.\n* 'limit' -- to limit the number of results returned.\n* 'analyzer' -- to use the specified analyzer as a search analyzer for this query.\n\nThe `options` map and any of the keys are optional.\nAn example of the `options` map: `{skip: 30, limit: 10, analyzer: 'none'}`\n"
- id: cypherproceduremetadata.db_index_stats
  other: "Returns index statistics"
- id: cypherproceduremetadata.db_index_vector_createnodeindex
  other: "Create a named node vector index for the specified label and property with the given vector dimensionality using either the EUCLIDEAN or COSINE similarity function.\nBoth similarity functions are case-insensitive.\nUse the `db.index.vector.queryNodes` procedure to query the named index.\n"
- id: cypherproceduremetadata.db_index_vector_createrelationshipindex
  other: "Creates vector index on relationships"
- id: cypherproceduremetadata.db_index_vector_drop
  other: "Drops vector index"
- id: cypherproceduremetadata.db_index_vector_embed
  other: "Embeds text using configured embedder"
- id: cypherproceduremetadata.db_index_vector_querynodes
  other: "Query the given node vector index.\nReturns requested number of nearest neighbors to the provided query vector,\nand their similarity score to that query vector, based on the configured similarity function for the index.\nNative cosine scores are in [-1, 1]; Euclidean scores are in (0, 1]; native dot-product scores are unbounded.\n"
- id: cypherproceduremetadata.db_index_vector_queryrelationships
  other: "Query the given relationship vector index.\nReturns requested number of nearest neighbors to the provided query vector,\nand their similarity score to that query vector, based on the configured similarity function for the index.\nNative cosine scores are in [-1, 1]; Euclidean scores are in (0, 1]; native dot-product scores are unbounded.\n"
