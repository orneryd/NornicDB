- id: cyphercore.empty_query
  description: Consulta Cypher vacía.
  other: consulta vacía
- id: cyphercore.composite_target_required
  description: La consulta compuesta requiere un componente explícito. Code y USE no se traducen.
  other: "{{.Code}}: Las consultas en bases de datos compuestas requieren un grafo de destino explícito. Use USE <composite>.<alias> para seleccionar un componente específico"
- id: cyphercore.invalid_label_name
  description: Identificador de etiqueta no válido. Label no se traduce.
  other: "nombre de etiqueta no válido: {{.Label}} (debe ser alfanumérico y comenzar con una letra o un guion bajo)"
- id: cyphercore.invalid_label_reserved
  description: Identificador de etiqueta reservado. Label no se traduce.
  other: "nombre de etiqueta no válido: {{.Label}} (contiene una palabra clave reservada)"
- id: cyphercore.invalid_property_key
  description: Identificador de propiedad no válido. Key no se traduce.
  other: "clave de propiedad no válida: {{.Key}} (debe ser alfanumérica y comenzar con una letra o un guion bajo)"
