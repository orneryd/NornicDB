  description: Error al fijar el espacio de nombres. Cause no se traduce.
  other: "no se pudo fijar el espacio de nombres de la transacción implícita: {{.Cause}}"
- id: cyphercore.implicit_transaction_configure_failed
  description: Error al configurar la transacción implícita. Cause no se traduce.
  other: "no se pudo configurar la transacción implícita: {{.Cause}}"
