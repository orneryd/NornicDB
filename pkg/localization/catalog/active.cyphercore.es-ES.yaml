  other: "no se puede analizar la consulta: se esperaba TO en el rango"
- id: cyphercore.fulltext_range_close_required
  description: Falta el delimitador de cierre del rango.
  other: "no se puede analizar la consulta: se esperaba ] o } para cerrar el rango"
- id: cyphercore.fulltext_range_endpoint_required
  description: Falta un extremo del rango.
  other: "no se puede analizar la consulta: se esperaba un extremo del rango"
- id: cyphercore.fulltext_bad_regex
  description: Expresión regular no válida. Pattern y Cause no se traducen.
  other: "no se puede analizar la consulta: expresión regular no válida /{{.Pattern}}/: {{.Cause}}"
- id: cyphercore.fulltext_bad_wildcard
  description: Comodín no válido. Cause no se traduce.
  other: "no se puede analizar la consulta: comodín no válido: {{.Cause}}"
- id: cyphercore.index_hint_not_found
  description: El índice solicitado no existe. Hint, Label y Property no se traducen.
  other: "no se encontró ningún índice para la sugerencia: {{.Hint}} (el índice en :{{.Label}}({{.Property}}) no existe)"
