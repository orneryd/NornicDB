  description: La incrustación no produjo un vector. NodeID no se traduce.
  other: WITH EMBEDDING devolvió un vector vacío para el nodo {{.NodeID}}
- id: cyphercore.optional_match_required
  description: OPTIONAL no está seguido de MATCH.
  other: OPTIONAL debe estar seguido de MATCH
- id: cyphercore.unterminated_string_literal
  description: Literal de cadena Cypher sin terminar.
  other: literal de cadena sin terminar
