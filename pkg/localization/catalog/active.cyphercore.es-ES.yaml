  description: Error al crear el plan de ejecución. Cause no se traduce.
  other: "no se pudo crear el plan de ejecución: {{.Cause}}"
- id: cyphercore.typed_decode_row_failed
  description: Error al decodificar una fila tipada. Cause no se traduce.
  other: "no se pudo decodificar la fila: {{.Cause}}"
- id: cyphercore.typed_destination_pointer_required
  description: El destino tipado debe ser un puntero válido.
  other: el destino debe ser un puntero no nulo
- id: cyphercore.typed_destination_unsupported
  description: Tipo de destino no admitido. Kind no se traduce.
  other: "tipo de destino no admitido: {{.Kind}}"
- id: cyphercore.typed_field_failed
  description: Error al asignar un campo. Field y Cause no se traducen.
  other: "campo {{.Field}}: {{.Cause}}"
- id: cyphercore.typed_time_parse_failed
  description: Error al analizar una hora. Value no se traduce.
  other: "no se puede analizar la hora: {{.Value}}"
- id: cyphercore.typed_assignment_failed
  description: Asignación tipada incompatible. Los tipos no se traducen.
  other: "no se puede asignar {{.ValueType}} a {{.DestinationType}}"
- id: cyphercore.embedder_not_configured
  description: No hay un generador de incrustaciones configurado.
  other: no hay un generador de incrustaciones configurado
- id: cyphercore.embedding_no_output
  description: La incrustación de consulta no produjo vectores.
  other: no se pudo generar la incrustación de la consulta (no se produjeron incrustaciones)
