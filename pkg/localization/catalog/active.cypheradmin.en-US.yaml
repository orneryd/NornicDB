- id: cypheradmin.database_manager_unavailable
  description: Cypher admin command failure. Command is untranslated Cypher syntax.
  other: "database manager not available - {{.Command}} requires multi-database support"
- id: cypheradmin.invalid_syntax
  description: Cypher admin syntax failure. Command is untranslated Cypher syntax.
  other: "invalid {{.Command}} syntax"
- id: cypheradmin.database_name_expected
  description: Missing database name. Command is untranslated Cypher syntax.
  other: "invalid {{.Command}} syntax: database name expected"
