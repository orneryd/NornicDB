- id: nornicdbcli.root.short
  description: Main CLI summary.
  other: NornicDB - High-Performance Graph Database for LLM Agents
- id: nornicdbcli.root.long
  description: Main CLI detailed help.
  other: |-
    NornicDB is a purpose-built graph database written in Go,
    designed for AI agent memory with Neo4j Bolt/Cypher compatibility.

    Features:
      • Neo4j Bolt protocol compatibility
      • Cypher query language support
      • Knowledge-layer scoring with declarative decay profiles
      • Automatic relationship inference
      • Built-in vector search with RRF hybrid ranking
      • Server-side embedding generation
