  description: Error al abrir una fuente CSV gzip.
  other: no se pudo abrir el archivo CSV gzip
- id: adminimport.open_zip_csv_failed
  description: Error al abrir una fuente CSV ZIP.
  other: no se pudo abrir el archivo CSV ZIP
- id: adminimport.open_zip_member_failed
  description: Error al abrir el miembro CSV de una fuente ZIP.
  other: no se pudo abrir el miembro CSV comprimido
- id: adminimport.csv_parse_error
  description: Error al analizar CSV. Where no se traduce.
  other: "error de análisis CSV en {{.Where}}"
- id: adminimport.scan_directory_failed
  description: Error al examinar el directorio CSV de Neo4j.
  other: no se pudo examinar el directorio CSV de Neo4j
- id: adminimport.read_header_failed
  description: Error al leer un encabezado CSV.
  other: no se pudo leer el encabezado CSV
