- id: adminimport.bad_end_tolerance_exceeded
  description: Tolerancia superada porque falta un nodo final.
  other: "se superó la tolerancia de relaciones no válidas en la fila {{.Row}} ({{.BadCount}} > {{.Tolerance}}): falta el nodo final"
