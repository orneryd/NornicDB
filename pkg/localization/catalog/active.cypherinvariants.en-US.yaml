- id: cypherinvariants.pipeline_declined_after_write
  description: A statement the pipeline executor started writing could not be finished there; running it again on another route would repeat the writes. Clause is the untranslated Cypher clause text.
  other: 'pipeline could not finish a statement after it had written ({{.Clause}}); the statement was not run again'
