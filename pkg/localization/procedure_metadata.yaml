- {
    name: db.awaitIndex,
    en: "Wait for an index to come online (for example: CALL db.awaitIndex(\"MyIndex\", 300)).",
    es: "Espera a que un índice esté en línea",
  }
- {
    name: db.awaitIndexes,
    en: "Wait for all indexes to come online (for example: CALL db.awaitIndexes(300)).",
    es: "Espera a que todos los índices estén en línea",
  }
- {
    name: db.clearQueryCaches,
    en: "Clears all query caches.",
    es: "Borra las cachés de consultas",
  }
- {
    name: db.constraints,
    en: "Lists all constraints in the database",
    es: "Enumera todas las restricciones de la base de datos",
  }
- {
    name: db.create.setNodeVectorProperty,
    en: "Sets vector property on a node",
    es: "Establece una propiedad vectorial en un nodo",
  }
- {
    name: db.create.setRelationshipVectorProperty,
    en: "Sets vector property on a relationship",
    es: "Establece una propiedad vectorial en una relación",
  }
- {
    name: db.index.fulltext.createNodeIndex,
    en: "Creates fulltext index on nodes",
    es: "Crea un índice de texto completo en nodos",
  }
- {
    name: db.index.fulltext.createRelationshipIndex,
    en: "Creates fulltext index on relationships",
    es: "Crea un índice de texto completo en relaciones",
  }
- {
    name: db.index.fulltext.drop,
    en: "Drops fulltext index",
    es: "Elimina un índice de texto completo",
  }
- {
    name: db.index.fulltext.listAvailableAnalyzers,
    en: "List the available analyzers that the full-text indexes can be configured with.",
    es: "Enumera los analizadores disponibles",
  }
- {
    name: db.index.fulltext.queryNodes,
    en: "Query the given full-text index. Returns the matching nodes and their native fulltext query score, ordered by score.\nValid _key: value_ pairs for the `options` map are:\n\n* 'skip' -- to skip the top N results.\n* 'limit' -- to limit the number of results returned.\n* 'analyzer' -- to use the specified analyzer as a search analyzer for this query.\n\nThe `options` map and any of the keys are optional.\nAn example of the `options` map: `{skip: 30, limit: 10, analyzer: 'none'}`\n",
    es: "Busca texto completo en nodos",
  }
- {
    name: db.index.fulltext.queryRelationships,
    en: "Query the given full-text index. Returns the matching relationships and their native fulltext query score, ordered by score.\nValid _key: value_ pairs for the `options` map are:\n\n* 'skip' -- to skip the top N results.\n* 'limit' -- to limit the number of results returned.\n* 'analyzer' -- to use the specified analyzer as a search analyzer for this query.\n\nThe `options` map and any of the keys are optional.\nAn example of the `options` map: `{skip: 30, limit: 10, analyzer: 'none'}`\n",
    es: "Busca texto completo en relaciones",
  }
- {
    name: db.index.stats,
    en: "Returns index statistics",
    es: "Devuelve estadísticas del índice",
  }
- {
    name: db.index.vector.createNodeIndex,
    en: "Create a named node vector index for the specified label and property with the given vector dimensionality using either the EUCLIDEAN or COSINE similarity function.\nBoth similarity functions are case-insensitive.\nUse the `db.index.vector.queryNodes` procedure to query the named index.\n",
    es: "Crea un índice vectorial en nodos",
  }
- {
    name: db.index.vector.createRelationshipIndex,
    en: "Creates vector index on relationships",
    es: "Crea un índice vectorial en relaciones",
  }
- {
    name: db.index.vector.drop,
    en: "Drops vector index",
    es: "Elimina un índice vectorial",
  }
- {
    name: db.index.vector.embed,
    en: "Embeds text using configured embedder",
    es: "Genera el embedding del texto con el generador configurado",
  }
- {
    name: db.index.vector.queryNodes,
    en: "Query the given node vector index.\nReturns requested number of nearest neighbors to the provided query vector,\nand their similarity score to that query vector, based on the configured similarity function for the index.\nNative cosine scores are in [-1, 1]; Euclidean scores are in (0, 1]; native dot-product scores are unbounded.\n",
    es: "Realiza una búsqueda vectorial en nodos",
  }
- {
    name: db.index.vector.queryRelationships,
    en: "Query the given relationship vector index.\nReturns requested number of nearest neighbors to the provided query vector,\nand their similarity score to that query vector, based on the configured similarity function for the index.\nNative cosine scores are in [-1, 1]; Euclidean scores are in (0, 1]; native dot-product scores are unbounded.\n",
    es: "Realiza una búsqueda vectorial en relaciones",
  }
- {
    name: db.indexes,
    en: "Lists all indexes in the database",
    es: "Enumera todos los índices de la base de datos",
  }
- {
    name: db.infer,
    en: "LLM inference procedure",
    es: "Procedimiento de inferencia LLM",
  }
- {
    name: db.info,
    en: "Provides information regarding the database.",
    es: "Devuelve información de la base de datos",
  }
- {
    name: db.labels,
    en: "List all labels attached to nodes within a database according to the user's access rights. The procedure returns empty results if the user is not authorized to view those labels.",
    es: "Enumera todas las etiquetas de la base de datos",
  }
- {
    name: db.ping,
    en: "This procedure can be used by client side tooling to test whether they are correctly connected to a database. The procedure is available in all databases and always returns true. A faulty connection can be detected by not being able to call this procedure.",
    es: "Comprueba la conectividad de la base de datos",
  }
- {
    name: db.propertyKeys,
    en: "List all property keys in the database.",
    es: "Enumera todas las claves de propiedad de la base de datos",
  }
- {
    name: db.relationshipTypes,
    en: "List all types attached to relationships within a database according to the user's access rights. The procedure returns empty results if the user is not authorized to view those relationship types.",
    es: "Enumera todos los tipos de relación de la base de datos",
  }
- {
    name: db.rerank,
    en: "Standalone rerank procedure",
    es: "Procedimiento independiente de reordenación",
  }
- {
    name: db.resampleIndex,
    en: "Schedule resampling of an index (for example: CALL db.resampleIndex(\"MyIndex\")).",
    es: "Vuelve a muestrear las estadísticas del índice",
  }
- {
    name: db.retrieve,
    en: "Hybrid retrieval procedure",
    es: "Procedimiento de recuperación híbrida",
  }
- {
    name: db.rretrieve,
    en: "Hybrid retrieval + rerank procedure",
    es: "Procedimiento de recuperación híbrida y reordenación",
  }
- {
    name: db.schema.nodeProperties,
    en: "Returns node properties by label",
